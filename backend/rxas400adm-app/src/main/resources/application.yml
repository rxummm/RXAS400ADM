spring:
  application:
    name: rxas400adm
  profiles:
    # 默认演示模式（使用 MockAS400Client，无需真实 IBM i）
    active: mock
  task:
    # C9：调度线程池扩容（默认单线程）——慢采集/长同步不再拖垮黑名单清理、告警升级等定时任务
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:3}
  web:
    # W2：无 Accept-Language 时的校验消息默认语言（前端会显式传 Accept-Language）
    locale: zh-CN
  datasource:
    url: jdbc:mysql://localhost:3306/rxas400adm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useServerPrepStmts=true&auto-commit=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # P2: HikariCP 连接池参数配置化
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONN_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      # B15：移除多余 connection-test-query（HikariCP 默认用 JDBC4 isValid() 探活，SELECT 1 为冗余旧配置）
      leak-detection-threshold: ${HIKARI_LEAK_THRESHOLD:60000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
    # 关闭占位符替换：V48 文档模板内容含字面量 ${title}（应用运行时替换），
    # Flyway 默认把 ${...} 当占位符解析会报 No value provided for placeholder；全库迁移不依赖占位符。
    placeholder-replacement: false
    # V31 为纯注释说明迁移（无 SQL 语句），Flyway 10 默认拒绝空迁移，故显式放行
    allow-empty-migrations: true
  servlet:
    multipart:
      # IFS 上传/文档附件上限：显式声明并防内存耗尽，超限由 GlobalExceptionHandler 转 400 友好提示
      max-file-size: 100MB
      max-request-size: 100MB
  lifecycle:
    # 优雅停机超时时间（30秒）
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  # 优雅停机：等待进行中的操作完成后再关闭应用
  shutdown: graceful

# P2: Actuator 健康检查 + 指标端点（仅暴露必要端点，管理端点需 ADMIN 角色）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
    prometheus:
      # Prometheus 端点需认证（与 metrics 同策略）
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: rxas400adm
  health:
    db:
      enabled: true
    mail:
      enabled: false
    diskspace:
      enabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# P3: Quartz JDBC JobStore（替代 RAMJobStore，支持多节点集群）
spring.quartz:
  job-store-type: jdbc
  jdbc:
    initialize-schema: always
  properties:
    org.quartz.scheduler.instanceName: rxas400adm
    org.quartz.scheduler.instanceId: AUTO
    org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
    org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
    org.quartz.jobStore.tablePrefix: QRTZ_
    org.quartz.jobStore.isClustered: true
    org.quartz.jobStore.clusterCheckinInterval: 15000
    org.quartz.jobStore.misfireThreshold: 60000
    org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
    org.quartz.threadPool.threadCount: 5

rxas400:
  jwt:
    # 生产环境必须通过环境变量 RXAS400_JWT_SECRET 覆盖（≥32 字节）；空兜底避免「漏配即公开默认值」
    secret: ${RXAS400_JWT_SECRET:}
    # B9：access token 有效期 24h（原 2h，已调整以匹配生产环境；依赖已有 refresh token（默认 7d）轮换）
    expire-ms: 86400000
    # P2-1：令牌 iss/aud 声明（校验时强制匹配，换值后旧令牌全部失效需重新登录）
    issuer: rxas400adm
    audience: rxas400-ui
    # P2: Refresh token 有效期（默认 7 天）
    refresh-expire-ms: 604800000
  monitor:
    collect-interval-ms: 10000
    # 指标保留天数（2.1.7）：每日凌晨清理超过该天数的历史指标
    retention-days: 30
  alert:
    # 告警未处理自动升级配置
    upgrade:
      # 功能开关（默认关闭）
      enabled: ${RXAS400_ALERT_UPGRADE_ENABLED:false}
      # 检查间隔（毫秒，默认 300000 = 5 分钟；@Scheduled fixedDelayString 直接消费，杜绝单位换算错误）
      check-interval-ms: 300000
      # 未处理多久后升级（分钟）
      upgrade-after-minutes: 30
      # 升级通知的角色
      notify-role: ADMIN
  crypto:
    # AS400 连接密码 AES-256-GCM 加密密钥。生产环境必须通过环境变量覆盖。
    # 生成方式: openssl rand -base64 32
    key: ${RXAS400_CRYPTO_KEY:}
  security:
    # 可信反向代理 IP（逗号分隔，S3）：仅当请求直接来自这些 IP 时才信任 X-Forwarded-For。
    # 留空（默认）= 完全忽略 X-Forwarded-For，直连/内网部署无需配置；
    # 部署在 nginx 后时填 nginx 所在 IP（如 127.0.0.1），多个用逗号分隔。
    trusted-proxies: ${RXAS400_TRUSTED_PROXIES:}
    # CORS 允许来源白名单（逗号分隔，S4）：默认仅开发源 localhost:5173。
    # 生产通过环境变量 RXAS400_CORS_ALLOWED_ORIGINS 覆盖（如 https://adm.example.com）。
    cors-allowed-origins: ${RXAS400_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    # P2-5：数据库加载权限抛异常时是否回退 token 内嵌权限（默认 false=拒绝闭合；
    # 开启后 DB 故障窗口内被禁用/删除用户可能凭旧 token 继续访问）
    permission-fallback-on-error: false
    login:
      # P2-4：失败锁定阈值与时长（次 / 分钟）
      max-failed: 5
      lock-minutes: 15
    # 请求限流（Bucket4j）
    rate-limit:
      enabled: true
      login-per-minute: 5
      command-per-minute: 10
      api-per-minute: 60
  ibmi:
    host: ${RXAS400_IBMI_HOST:}
    user: ${RXAS400_IBMI_USER:}
    password: ${RXAS400_IBMI_PASSWORD:}
  ifs:
    # IFS 文档受管根目录（DocStorageService 使用）
    doc-root: ${RXAS400_IFS_DOC_ROOT:/QOpenSys/rxas400/document}
    # S1：IFS 访问根目录白名单（逗号分隔，超出即 BAD_REQUEST；回收站位于其下无需单列）
    allowed-roots: /QOpenSys/rxas400
  doc:
    # T3：IFS 发布补偿 sweep 间隔（毫秒）
    ifs-resweep-ms: 1800000
  # 【第六章·P1】cl-blacklist 两键已迁 rx_config（V57 种子），在「系统配置」页维护并实时生效——yml 不再声明

logging:
  level:
    com.rxas400adm: info