spring:
  datasource:
    # 生产数据库：可在服务器上配置环境变量覆盖
    url: jdbc:mysql://${RXAS400_DB_HOST:localhost}:${RXAS400_DB_PORT:3306}/${RXAS400_DB_NAME:rxas400adm}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=${RXAS400_DB_USE_SSL:false}&allowPublicKeyRetrieval=true&useServerPrepStmts=true&auto-commit=true
    username: ${RXAS400_DB_USER:root}
    # 生产强制环境变量注入，删除 :root 兜底，防止误配静默使用默认口令
    password: ${RXAS400_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产开启校验（2.11）：历史脚本被篡改时启动即失败，防止静默漂移
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 1
    # 关闭占位符替换（继承 base 亦可，显式声明防独立部署遗漏）：V48 模板含 ${title} 字面量
    placeholder-replacement: false
    # V31 为纯注释说明迁移（无 SQL 语句），Flyway 10 默认拒绝空迁移
    allow-empty-migrations: true

server:
  port: ${RXAS400_PORT:8080}

rxas400:
  jwt:
    secret: ${RXAS400_JWT_SECRET}
    expire-ms: 86400000
  crypto:
    key: ${RXAS400_CRYPTO_KEY}
  monitor:
    collect-interval-ms: ${RXAS400_COLLECT_INTERVAL:10000}

logging:
  file:
    name: ${RXAS400_LOG_DIR:./logs}/rxas400.log
  level:
    com.rxas400adm: info

# P1-8：生产环境禁用 Swagger/OpenAPI 接口文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false